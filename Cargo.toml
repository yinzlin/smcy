[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/domain",
    "crates/database",
    "crates/application",
    "crates/backend",
]
# crates/frontend 为 React 前端工程（npm 构建），不参与 cargo workspace
exclude = ["crates/frontend"]

[workspace.dependencies]
# ---- 内部 crate ----
common = { path = "crates/common" }
domain = { path = "crates/domain" }
database = { path = "crates/database" }
application = { path = "crates/application" }

# ---- 外部依赖（版本与 features 与原单 crate 保持一致） ----
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
rand = "0.8"
bytes = "1"
rust_xlsxwriter = "0.81"
calamine = "0.36"
tray-icon = "0.24.1"
tao = "0.35.3"
mime = "0.3"
bcrypt = "0.15"
rust-embed = "8"
mime_guess = "2"
